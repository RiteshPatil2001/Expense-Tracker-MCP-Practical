
[project]
name = "expense-tracker-mcp-server"
version = "0.1.0"
description = "Local MCP server for managing expenses"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_server"]
